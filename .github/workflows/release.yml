name: Release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - name: Validate release tag
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm build
      # The publish smoke installs the packed bridge tarball into a fresh web
      # profile and boots a real host, so a release tag can never ship a
      # tarball that would not register and load as a published plugin.
      - run: pnpm run test:publish
      - run: ./scripts/package-release.ps1
      - run: ./scripts/test-installer.ps1 -BundleDirectory ./release
        shell: powershell
      - name: Validate Windows installer syntax
        shell: powershell
        run: |
          $files = @('scripts/install.ps1', 'scripts/install-web.ps1', 'scripts/install-desktop.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse errors in $file"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-browser-release
          path: release/*
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsh-browser-release
          path: release
      - name: Create reviewable release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --draft --verify-tag --title "$RELEASE_TAG" --notes "Windows Desktop prebuilt installer. Extract the Windows ZIP and run install.ps1. See README.zh.md for setup."
