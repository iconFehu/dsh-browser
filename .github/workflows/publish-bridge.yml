name: Publish bridge plugin

# Publishes @yuxianglin/dsh-bridge-browser to the npm registry.
#
# Triggers:
#   - a tag named bridge-v* (e.g. bridge-v0.0.5) pushed from the package's
#     release commit, or
#   - manual dispatch after the package version has been bumped locally.
#
# Manual publishing (recommended for maintainers):
#   pnpm install --frozen-lockfile
#   pnpm --filter @yuxianglin/dsh-bridge-browser publish --access public
# The prepack script builds lib/ before packing, so a dirty or unbuilt tree
# can never be published. Requires an npm account that owns the @yuxianglin
# scope (npm whoami && npm access).

on:
  workflow_dispatch:
  push:
    tags: ['bridge-v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yuxianglin/dsh-bridge-browser run typecheck
      - run: pnpm --filter @yuxianglin/dsh-bridge-browser run test
      # Pack + register + boot a real web host from the tarball that would be
      # published; refuses to ship a broken artifact even on manual dispatch.
      - run: pnpm run test:publish
      - run: pnpm --filter @yuxianglin/dsh-bridge-browser publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
